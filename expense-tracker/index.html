<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense-Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./index.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="bg-[#fff] py-6 px-4 rounded-lg w-full flex items-center justify-center">
            <div class="flex flex-col items-center justify-center gap-8 w-full">
                <div class="flex flex-col items-center justify-center gap-5 w-full max-w-[500px]">
                    <h1 class="text-4xl font-bold">My Expense</h1>
                    <div
                        class="flex items-center justify-between rounded-lg  py-5 px-8 bg-[#52d852] text-[#fff] text-xl font-semibold w-full">
                        <h4>Current Balance</h4>
                        <h4 id="curBalance">0</h4>
                    </div>
                    <div class="flex justify-center items-center gap-6 w-full">
                        <div
                            class="flex justify-between items-center w-full bg-[rgb(72,72,227)] py-4 px-6 rounded-lg text-[#fff] text-xl font-bold">
                            <i class="fa-solid fa-arrow-up"></i>
                            <div>
                                <h2>Income</h2>
                                <h2 id="income">0</h2>
                            </div>
                        </div>
                        <div
                            class="flex justify-between items-center w-full bg-[#FF5B62] py-4 px-6 rounded-lg text-[#fff] text-xl font-bold">
                            <i class="fa-solid fa-arrow-down"></i>
                            <div>
                                <h2>Expense</h2>
                                <h2 id="expense">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col  justify-center items-start w-full gap-4 lg:flex-row">
                    <div class="flex flex-col justify-start gap-4 shadow-md py-4 px-6 rounded-md w-full">
    <h2 class="text-2xl font-bold">Add Expenses</h2>

    <form
        class="flex flex-col gap-4 rounded-md w-full max-h-90 overflow-y-auto"
        id="expenseForm"
    >
                            <div class="flex flex-col w-full justify-center gap-2">
                                <label for="desc" class="text-lg font-semibold">Description</label>
                                <input type="text" placeholder="Enter description" id="desc"
                                    class="text-sm text-[#6B7280] font-semibold py-2 px-3 rounded-lg border border-gray-200 focus:border-[rgb(44,147,188)] focus:outline-none">
                                <small id="descError" class="text-red-900"></small>
                            </div>
                            <div class="flex flex-col w-full justify-center gap-2">
                                <label for="amount" class="text-lg font-semibold">Amount</label>
                                <input type="number" placeholder="Enter amount" id="amount"
                                    class="text-sm text-[#6B7280] font-semibold py-2 px-3 rounded-lg border border-gray-200 focus:border-[rgb(44,147,188)] focus:outline-none">
                                <small id="amountError" class="text-red-900"></small>
                            </div>
                            <div class="flex flex-col w-full justify-center gap-2">
                                <label for="date" class="text-lg font-semibold">Date</label>
                                <input type="date" id="date"
                                    class="text-sm text-[#6B7280] font-semibold py-2 px-3 rounded-lg border border-gray-200 focus:border-[rgb(44,147,188)] focus:outline-none">
                                <small id="dateError" class="text-red-900"></small>
                            </div>
                            <div class="flex flex-col w-full justify-center gap-2">
                                <label for="category" class="text-lg font-semibold">Category</label>

                                <select id="category"
                                    class="text-sm text-[#6B7280] font-semibold py-2 px-3 rounded-lg border border-gray-200 focus:border-[rgb(44,147,188)] focus:outline-none">
                                    <option value="select">Select category</option>
                                    <option value="food">Food</option>
                                    <option value="transport">Transport</option>
                                    <option value="shopping">Shopping</option>
                                    <option value="bills">Bills</option>
                                    <option value="other">Other</option>
                                </select>

                                <small id="categoryError" class="text-red-900"></small>
                            </div>
                            <div class="flex flex-col w-full justify-center gap-2">
                                <label for="type" class="text-lg font-semibold">Type</label>
                                <select type="date" id="type"
                                    class="text-sm text-[#6B7280] font-semibold py-2 px-3 rounded-lg border border-gray-200 focus:border-[rgb(44,147,188)] focus:outline-none">
                                    <option value="select">Select expense type</option>
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                                <small id="typeError" class="text-red-900"></small>
                            </div>
                            <button class="bg-[rgb(72,72,227)] py-2 px-3 text-[#fff] rounded-lg" id="addBtn">Add
                                Expense</button>
                        </form>
                    </div>
                    <div class="flex flex-col items-start justify-center gap-4 w-full py-4 px-6">
                        <h2 class="text-2xl font-bold">Your Transaction History</h2>
                        <ul id="tasks" class="flex flex-col justify-start gap-4 w-full max-h-60 overflow-y-auto">
                        </ul>
                                        <div class="flex flex-col justify-center gap-4 shadow-md py-4 px-6 rounded-md w-full">
    <h2 class="text-2xl font-bold">Expenses by Category</h2>

    <div id="categorySummary" class="flex flex-col gap-3 w-full">
    </div>
</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
