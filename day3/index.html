<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="./index.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-sky-100">
    <div class="container">
        <div class="flex flex-col items-start justify-between gap-10 py-5 px-2 lg:py-10 lg:px-5 bg-white/80 backdrop-blur-sm rounded-3xl lg:flex-row lg:gap-20">
    <div class="flex items-start justify-center gap-5">
    <input type="text" placeholder="Enter any value..." class="text-lg py-2 px-3 rounded-lg outline-none" id="input">
    <button class="py-2 px-4 bg-sky-500 text-white rounded-lg" id="addBtn">Add</button>
    </div>
    <div class="flex flex-col justify-center lg:items-start gap-4 w-full">
        <select id="dropdown" class="outline-none py-2 px-3 rounded-xl shadow-sm bg-white/70"> 
          <option value="all">All</option>
      <option value="completed">Completed</option>
      <option value="notCompleted">Not Completed</option>
  </select>
    <ul id="taskList" class="flex flex-col justify-center items-center gap-2 w-full"></ul>
    </div>
    </div>
    </div>
  </body>
</html>
