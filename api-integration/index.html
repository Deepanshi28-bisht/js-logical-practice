<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./index.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <div class="container">
      <section
        class="py-20 flex flex-col justify-center items-center gap-10 px-4 lg:px-0 w-full"
      >
        <div class="flex justify-between w-full px-10 items-center">
          <h1 class="text-4xl font-bold leading-[78%]">Posts</h1>
          <button
            id="createPost"
            class="px-3 py-2 bg-sky-600 text-white rounded-lg font-bold"
          >
            Create Post
          </button>
        </div>
        <div id="loader" class="hidden flex justify-center items-center py-5">
          <div
            class="w-8 h-8 border-4 border-sky-200 border-t-sky-500 rounded-full animate-spin"
          ></div>
        </div>

        <div
          id="postContainer"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"
        ></div>
        <div
          class="hidden flex flex-col items-start justify-center gap-3 shadow-md rounded-lg bg-sky-100 p-6 postCommentMain"
        >
          <div
            id="postDetails"
            class="flex flex-col items-start justify-center gap-3"
          ></div>
          <div id="commentContainer" class="hidden flex flex-col gap-5"></div>
        </div>
      </section>

      <div
        id="createPostMain"
        class="hidden flex-col items-center justify-center gap-3 mx-auto bg-sky-100 p-6 rounded-lg shadow-md"
      >
        <h2 class="text-2xl font-bold text-sky-600">Create New Post</h2>
        <form id="createPostForm" class="flex flex-col gap-4">
          <input
            id="postTitle"
            type="text"
            placeholder="enter post title...."
            required
            class="p-3 rounded-lg border border-gray-300 outline-none"
          />
          <textarea
            id="postBody"
            rows="4"
            placeholder="write your post"
            required
            class="p-3 rounded-lg border border-gray-300 outline-none"
          ></textarea>
          <button
            type="submit"
            class="py-3 px-5 bg-sky-500 rounded-lg text-white font-bold"
          >
            Submit
          </button>
        </form>
        <p id="createPostMessage"></p>
      </div>
      <div id="editPost" class="hidden flex-col gap-4 items-center justify-center bg-sky-100 p-6 rounded-lg">
        <h4 class="text-xl font-bold">Edit Your Post</h4>
      </div>
    </div>
  </body>
</html>
